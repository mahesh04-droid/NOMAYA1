{% extends 'base.html' %}

{% block content %}
<main style="padding: 100px 5%; max-width: 600px; margin: 0 auto; text-align: center; min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <h1 style="font-family: 'Playfair Display', serif; margin-bottom: 15px;">Order Confirmed</h1>
    <p style="color: #666; margin-bottom: 30px;">Thank you for your purchase. Your order #{{ order.id }} has been successfully placed.</p>
    
    <div style="display: flex; gap: 15px;">
        <a href="{% url 'orders' %}" class="btn">View Orders</a>
        <a href="{% url 'home' %}" class="btn outline">Return Home</a>
    </div>
</main>
{% endblock %}
