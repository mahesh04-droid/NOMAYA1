{% extends 'base.html' %}

{% block content %}
<main>
    <section class="studio">
        <div class="studio-visual">
            <div class="studio-title">
                <span>STEP 1 &middot; FABRIC</span>
                <h1>The Draping<br/>Studio.</h1>
            </div>
            <img src="/static/images/linen.jpg" alt="Studio Visual" id="studio-img" style="transition: opacity 0.4s ease;">
            <div class="fabric-strip">
                <button onclick="setFabric(0, this)"><div class="mini-fabric f0"></div></button>
                <button onclick="setFabric(1, this)"><div class="mini-fabric f1"></div></button>
                <button onclick="setFabric(2, this)"><div class="mini-fabric f2"></div></button>
                <button onclick="setFabric(3, this)"><div class="mini-fabric f3"></div></button>
            </div>
        </div>
        <script>
    const visuals = [
        "/static/images/linen.jpg",
        "/static/images/silk.jpg",
        "/static/images/cotton.jpg",
        "/static/images/chiffon.jpg"
    ];
    
    function setFabric(index, btn) {
        // Handle active state
        document.querySelectorAll('.fabric-strip button').forEach(b => {
            b.style.transform = 'scale(1)';
            b.style.border = 'none';
        });
        btn.style.transform = 'scale(1.1)';
        btn.style.border = '2px solid var(--plum)';
        
        // Handle crossfade
        const img = document.getElementById('studio-img');
        img.style.opacity = 0;
        setTimeout(() => {
            img.src = visuals[index];
            img.style.opacity = 1;
        }, 400);
    }
</script>
        
        <aside class="studio-panel">
            <div class="steps">
                <span class="on">1</span><span>2</span><span>3</span><span>4</span>
            </div>
            
            <label>Fabric
                <select>
                    <option>100% Linen</option>
                    <option>Pure Silk</option>
                    <option>Cotton Chiffon</option>
                </select>
            </label>
            
            <label>Style
                <div class="segmented">
                    <button class="selected">Pre-stitched</button>
                    <button>Classic</button>
                </div>
            </label>
            
            <div class="divider"></div>
            
            <p>How do you want to feel?</p>
            <div class="moods small">
                <button class="selected"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>Air</button>
                <button><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>Drift</button>
                <button><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Mood</button>
                <button><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Play</button>
            </div>
            
            <a class="btn full" href="{% url 'drape_finder' %}">See My Drape</a>
            
            <hr style="margin: 30px 0; border: none; border-top: 1px solid #eaeaea;">
            <p style="margin-bottom:10px; font-weight:bold;">Need a personal touch?</p>
            <p style="font-size:12px; color:#666; margin-bottom:15px;">Book a 1-on-1 virtual styling session with our expert drapers.</p>
            <a href="https://calendly.com/nomaya-styling" target="_blank" class="btn outline full" style="display:flex; justify-content:center; align-items:center; gap:10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                Book Virtual Styling
            </a>
        </aside>
    </section>
</main>
{% endblock %}
