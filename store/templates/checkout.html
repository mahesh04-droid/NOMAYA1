{% extends 'base.html' %}

{% block content %}
<main style="padding: 100px 5%; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 350px; gap: 40px; min-height: 80vh;">
    
    <div class="checkout-form" style="background: white; padding: 40px; border: 1px solid #e0e0e0;">
        <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 30px;">Shipping Details</h2>
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.8rem; letter-spacing: 1px; color: #666; margin-bottom: 8px;">STREET ADDRESS</label>
                <input type="text" name="street" required style="width: 100%; padding: 12px; border: 1px solid #ddd; font-family: inherit;">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                <div>
                    <label style="display: block; font-size: 0.8rem; letter-spacing: 1px; color: #666; margin-bottom: 8px;">CITY</label>
                    <input type="text" name="city" required style="width: 100%; padding: 12px; border: 1px solid #ddd; font-family: inherit;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.8rem; letter-spacing: 1px; color: #666; margin-bottom: 8px;">ZIP CODE</label>
                    <input type="text" name="zipcode" required style="width: 100%; padding: 12px; border: 1px solid #ddd; font-family: inherit;">
                </div>
            </div>
            <button type="submit" class="btn full" style="width: 100%; padding: 16px;">Place Order</button>
        </form>
    </div>
    
    <div class="checkout-summary" style="background: #f8f8f8; padding: 40px; height: fit-content;">
        <h3 style="font-family: 'Playfair Display', serif; margin-bottom: 30px;">Order Summary</h3>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem;">
            <span>Subtotal</span>
            <span>₹{{ total }}</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem; padding-bottom: 15px; border-bottom: 1px solid #ddd;">
            <span>Shipping</span>
            <span>{% if shipping == 0 %}Free{% else %}₹{{ shipping }}{% endif %}</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: 500; font-size: 1.1rem; margin-top: 15px;">
            <span>Total</span>
            <span>₹{{ grand_total }}</span>
        </div>
    </div>
</main>
{% endblock %}
